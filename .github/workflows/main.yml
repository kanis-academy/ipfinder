name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Creer le projet
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'__END__'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "IPFinder"
          include(":app")
          __END__
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'__END__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __END__
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'__END__'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          __END__
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'__END__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ipfinder.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.ipfinder.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          __END__
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="IP Finder"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AirplaneService"
                      android:exported="false"
                      android:label="IP Finder"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          __END__
          mkdir -p $(dirname app/src/main/res/xml/accessibility_config.xml)
          cat > app/src/main/res/xml/accessibility_config.xml <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          __END__
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'__END__'
          <resources>
              <string name="service_desc">Permet à IP Finder d’activer et de désactiver le mode avion pour chercher une bonne IP.</string>
          </resources>
          __END__
          mkdir -p $(dirname app/src/main/res/drawable/ic_launcher.xml)
          cat > app/src/main/res/drawable/ic_launcher.xml <<'__END__'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#6C5CE7" android:pathData="M0,0h108v108h-108z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="7"
                  android:pathData="M48,50m-22,0a22,22 0,1 1,44 0a22,22 0,1 1,-44 0" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="8" android:strokeLineCap="round"
                  android:pathData="M64,66L82,84" />
          </vector>
          __END__
          mkdir -p $(dirname app/src/main/java/com/ipfinder/app/AirplaneService.kt)
          cat > app/src/main/java/com/ipfinder/app/AirplaneService.kt <<'__END__'
          package com.ipfinder.app
          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          class AirplaneService : AccessibilityService() {
              companion object {
                  var instance: AirplaneService? = null
              }
              private val h = Handler(Looper.getMainLooper())
              private val keys = listOf("avion", "airplane", "aeroplane", "flight mode", "vuelo", "flugmodus", "modo avi")
              override fun onServiceConnected() { instance = this }
              override fun onUnbind(intent: Intent?): Boolean { instance = null; return super.onUnbind(intent) }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              fun cycle(done: (Boolean) -> Unit) {
                  performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS)
                  h.postDelayed({
                      clickWithRetry(5) { on ->
                          if (!on) {
                              performGlobalAction(GLOBAL_ACTION_BACK)
                              done(false)
                          } else {
                              h.postDelayed({
                                  clickWithRetry(5) { off ->
                                      h.postDelayed({
                                          performGlobalAction(GLOBAL_ACTION_BACK)
                                          done(off)
                                      }, 600)
                                  }
                              }, 3500)
                          }
                      }
                  }, 1500)
              }
              private fun clickWithRetry(n: Int, cb: (Boolean) -> Unit) {
                  if (clickTile()) cb(true)
                  else if (n <= 1) cb(false)
                  else h.postDelayed({ clickWithRetry(n - 1, cb) }, 700)
              }
              private fun clickTile(): Boolean {
                  val root = rootInActiveWindow ?: return false
                  var n: AccessibilityNodeInfo? = find(root) ?: return false
                  while (n != null) {
                      if (n.isClickable) return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      n = n.parent
                  }
                  return false
              }
              private fun find(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  val t = ((n.text?.toString() ?: "") + " " + (n.contentDescription?.toString() ?: "")).lowercase()
                  if (keys.any { t.contains(it) }) return n
                  for (i in 0 until n.childCount) {
                      val r = find(n.getChild(i))
                      if (r != null) return r
                  }
                  return null
              }
          }
          __END__          mkdir -p $(dirname app/src/main/java/com/ipfinder/app/MainActivity.kt)
          cat > app/src/main/java/com/ipfinder/app/MainActivity.kt <<'__END__'
          package com.ipfinder.app
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.Vibrator
          import android.provider.Settings
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          class MainActivity : Activity() {
              private lateinit var web: WebView
              private val ui = Handler(Looper.getMainLooper())
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.addJavascriptInterface(Bridge(), "Android")
                  web.loadUrl("file:///android_asset/index.html")
                  setContentView(web)
              }
              private fun js(code: String) { ui.post { web.evaluateJavascript(code, null) } }
              inner class Bridge {
                  @JavascriptInterface
                  fun serviceOn(): Boolean = AirplaneService.instance != null
                  @JavascriptInterface
                  fun openAccessibility() {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  }
                  @JavascriptInterface
                  fun cycleAirplane() {
                      ui.post {
                          val s = AirplaneService.instance
                          if (s == null) js("onCycle(false)") else s.cycle { ok -> js("onCycle($ok)") }
                      }
                  }
                  @JavascriptInterface
                  fun fetchIp() {
                      Thread {
                          var ip = ""
                          for (i in 0 until 10) {
                              try {
                                  val c = URL("https://api.ipify.org").openConnection() as HttpURLConnection
                                  c.connectTimeout = 4000
                                  c.readTimeout = 4000
                                  ip = c.inputStream.bufferedReader().readText().trim()
                                  c.disconnect()
                                  if (ip.isNotEmpty()) break
                              } catch (e: Exception) {
                                  Thread.sleep(2000)
                              }
                          }
                          if (!Regex("^[0-9.]+$").matches(ip)) ip = ""
                          js("onIp('$ip')")
                      }.start()
                  }
                  @JavascriptInterface
                  fun listApps(): String {
                      val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val pm = packageManager
                      val arr = JSONArray()
                      pm.queryIntentActivities(q, 0)
                          .sortedBy { it.loadLabel(pm).toString().lowercase() }
                          .forEach {
                              arr.put(JSONObject().put("n", it.loadLabel(pm).toString()).put("p", it.activityInfo.packageName))
                          }
                      return arr.toString()
                  }
                  @JavascriptInterface
                  fun openVpn(target: String): Boolean {
                      return try {
                          val i = if (target.contains("://")) Intent(Intent.ACTION_VIEW, Uri.parse(target))
                          else packageManager.getLaunchIntentForPackage(target)
                          if (i == null) false else { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i); true }
                      } catch (e: Exception) { false }
                  }
                  @Suppress("DEPRECATION")
                  @JavascriptInterface
                  fun notifyFound() {
                      try {
                          (getSystemService(VIBRATOR_SERVICE) as Vibrator).vibrate(longArrayOf(0, 200, 100, 200), -1)
                          ToneGenerator(AudioManager.STREAM_NOTIFICATION, 100).startTone(ToneGenerator.TONE_PROP_BEEP, 300)
                      } catch (e: Exception) {}
                  }
              }
          }
          __END__          mkdir -p $(dirname app/src/main/assets/index.html)
          cat > app/src/main/assets/index.html <<'__END__'
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP Finder</title>
          <style>
          :root{--bg:#f3f1ff;--c:#fff;--t:#1e1a4d;--m:#6b678f;--l:#ddd9f7;--a:#6c5ce7;--ok:#12b886;--bad:#e03131}
          :root[data-theme=dark]{--bg:#0f0c29;--c:#211d44;--t:#f1efff;--m:#a9a5d8;--l:#3b3578}
          *{box-sizing:border-box}body{margin:auto;max-width:480px;padding:16px;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
          .c{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:16px;margin-bottom:14px}
          textarea,input[type=text],select{width:100%;font:inherit;background:transparent;color:var(--t);border:1.5px solid var(--l);border-radius:12px;padding:12px;margin-top:6px}
          select option{color:#000}textarea{min-height:150px;margin:0}
          .h{color:var(--m);font-size:.85rem;margin-top:6px}
          button{width:100%;border:0;color:#fff;font:inherit;font-weight:700;padding:15px;border-radius:16px;background:var(--a);margin-bottom:10px}
          .s{width:auto;padding:8px 12px;margin:0;background:var(--l);color:var(--t)}
          .o{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:var(--a);color:#fff;font-size:42px}
          .ok .o{background:var(--ok)}.bad .o{background:var(--bad)}.ok{border-color:var(--ok)}
          .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
          .g{color:var(--ok);font-weight:700}#log{max-height:130px;overflow:auto;font-size:.85rem;color:var(--m)}
          .st{text-align:center;padding-top:15vh}[hidden]{display:none!important}
          </style></head><body>
          <div class="r"><b id="br" hidden>IP Finder</b><span></span><button class="s" id="th">Thème</button></div>
          <div id="in" class="st"><svg width="130" height="130" viewBox="0 0 110 110"><rect width="110" height="110" rx="26" fill="#6c5ce7"/><circle cx="48" cy="50" r="24" fill="none" stroke="#fff" stroke-width="6"/><line x1="65" y1="67" x2="83" y2="85" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="48" y="56" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">IP</text></svg>
          <h1>IP Finder</h1><p class="h">Trouvez une bonne IP avant de connecter votre VPN.</p><button id="go">Commencer</button></div>
          <div id="ap" hidden>
          <div id="hero" class="c" style="text-align:center"><div class="o" id="o"></div><b id="msg"></b><div class="h" id="tr"></div></div>
          <div class="c"><div class="r"><b>Liste des bonnes IP</b><span id="n">0</span></div><textarea id="list" placeholder="Une IP par ligne"></textarea></div>
          <div class="c"><div class="r"><div><b>Assistant (accessibilité)</b><div class="h" id="svc">Inactif</div></div><button class="s" id="sb">Activer</button></div>
          <div class="h">Nécessaire pour le mode avion automatique. Désactivez le Wi-Fi et le VPN avant de chercher.</div></div>
          <div class="c"><b>Mon VPN</b><select id="va"><option value="">Choisir une application</option></select>
          <input type="text" id="vl" placeholder="ou collez un lien (facultatif)" autocapitalize="off">
          <div class="r" style="margin-top:10px"><span>Ouvrir le VPN automatiquement</span><input type="checkbox" id="au"></div></div>
          <button id="start">Lancer la recherche automatique</button><button id="stop" class="s" style="width:100%" hidden>Arrêter</button>
          <button id="vpn" hidden style="background:var(--ok)">Ouvrir mon VPN</button>
          <div class="c"><b>Journal</b><div id="log"></div></div></div>
          <script>
          var $=function(i){return document.getElementById(i)},A=window.Android,R=document.documentElement,run=false,k=0;
          function sv(a,b){try{localStorage.setItem(a,b)}catch(e){}}function ld(a){try{return localStorage.getItem(a)}catch(e){return null}}
          if(ld("th"))R.setAttribute("data-theme",ld("th"));
          $("th").onclick=function(){var n=R.getAttribute("data-theme")==="dark"?"light":"dark";R.setAttribute("data-theme",n);sv("th",n)};
          var re=/^((25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(25[0-5]|2[0-4]\d|1?\d?\d)$/;
          function ips(){return $("list").value.split(/[\s,;]+/).filter(function(x){return re.test(x)})}
          function up(){$("n").textContent=ips().length;sv("list",$("list").value)}
          $("list").oninput=up;if(ld("list")){$("list").value=ld("list");up()}
          var I={i:"🔍",r:"✈",ok:"✓",bad:"✕"};
          function S(c,m){$("hero").className="c "+(c==="ok"||c==="bad"?c:"");$("o").textContent=I[c];$("msg").textContent=m}
          S("i","Prêt");
          function log(t,g){var d=document.createElement("div");d.textContent=t;if(g)d.className="g";$("log").insertBefore(d,$("log").firstChild)}
          function rf(){var on=A&&A.serviceOn();$("svc").textContent=on?"Actif":"Inactif";$("sb").hidden=!!on}
          $("go").onclick=function(){$("in").hidden=true;$("ap").hidden=false;$("br").hidden=false;rf()};
          window.addEventListener("focus",rf);document.addEventListener("visibilitychange",rf);
          $("sb").onclick=function(){if(A)A.openAccessibility()};
          try{JSON.parse(A.listApps()).forEach(function(a){var o=document.createElement("option");o.value=a.p;o.textContent=a.n;$("va").appendChild(o)});if(ld("va"))$("va").value=ld("va")}catch(e){}
          $("va").onchange=function(){sv("va",$("va").value)};
          if(ld("vl"))$("vl").value=ld("vl");$("vl").oninput=function(){sv("vl",$("vl").value)};
          function call(s,f,ms){return new Promise(function(r){var t=setTimeout(function(){r(null)},ms);window[s]=function(v){clearTimeout(t);r(v)};f()})}
          function end(){run=false;$("stop").hidden=true;$("start").hidden=false}
          function ov(){var t=$("vl").value.trim()||$("va").value;if(!t){S("bad","Choisissez votre VPN");return}if(!A.openVpn(t))S("bad","Impossible d’ouvrir ce VPN")}
          $("vpn").onclick=ov;
          $("stop").onclick=function(){end();S("i","Recherche arrêtée")};
          $("start").onclick=async function(){
          if(!A){S("bad","Ouvrez dans l’application Android");return}
          var l=ips();if(!l.length){S("bad","Ajoutez votre liste d’IP");return}
          run=true;k=0;$("log").innerHTML="";$("vpn").hidden=true;$("start").hidden=true;$("stop").hidden=false;
          var f=true;
          while(run){
          k++;$("tr").textContent="Essai n° "+k;
          if(!f){
          if(!A.serviceOn()){S("bad","Activez l’assistant (accessibilité)");break}
          S("r","Mode avion activé, puis désactivé…");
          var ok=await call("onCycle",function(){A.cycleAirplane()},30000);
          if(!run)return;
          if(!ok){S("bad","Mode avion impossible. Vérifiez l’assistant.");break}}
          f=false;S("r","Lecture de l’IP…");
          var ip=await call("onIp",function(){A.fetchIp()},45000);
          if(!run)return;
          if(!ip){log("Pas de réseau");continue}
          if(l.indexOf(ip)>-1){log(ip+" : bonne IP",true);end();S("ok","IP trouvé ! "+ip+" — connectez votre VPN.");A.notifyFound();$("vpn").hidden=false;if($("au").checked)ov();return}
          log(ip+" : pas dans la liste")}
          end()};
          </script></body></html>
                    __END__
      - name: Compiler
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || { grep -E "^e: |error:|What went wrong" -A4 build.log | head -40; tail -15 build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: IPFinder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
